<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プライバシーポリシー | Quick Seek</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.7;
      background: #f7f7fb;
      color: #1a1a24;
      padding: 48px 16px 72px;
      display: flex;
      justify-content: center;
    }

    main {
      max-width: 720px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 16px 32px rgba(17, 20, 36, 0.08);
      border: 1px solid rgba(31, 31, 46, 0.08);
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.6rem);
      margin: 0 0 24px;
    }

    p {
      margin: 0 0 16px;
    }

    a {
      color: #3959ff;
    }

    address {
      font-style: normal;
      margin-top: 24px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111114;
        color: #e1e1f2;
      }

      main {
        background: #181820;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
      }

      a {
        color: #93a7ff;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>プライバシーポリシー</h1>
    <p>当拡張は個人情報を収集・保存・共有しません。</p>
    <p>テキスト選択時の文字数カウント等は端末内で処理します。</p>
    <p>ユーザーが翻訳（フォールバック時）または検索をクリックした場合に限り、選択テキストがその処理のため Google のサービス（Google 翻訳／Google 検索）へ送信されます。当拡張はその内容を保持しません。</p>
    <p>当拡張は Chrome Web Store の User Data および Limited Use ポリシーに従い、ここに記載した目的に限定してデータを扱います。</p>
    <address>連絡先：<a href="mailto:exmachina.work.k@gmail.com">exmachina.work.k@gmail.com</a></address>
  </main>
</body>
</html>
